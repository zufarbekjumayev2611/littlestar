<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Little Star — Navoiy-Qorako‘l o‘quv markazi</title>
<meta name="description" content="Little Star — Navoiy-Qorako‘l o‘quv markazi. 6–10 yoshli bolalar uchun ta’limiy o‘yinlar platformasi.">
<meta name="theme-color" content="#1b1450">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Star">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5c8a;--blue:#3d8bff;--green:#1fbf75;--orange:#ff9f1c;--purple:#8e5cff;--yellow:#ffd23f;--ink:#23204a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100%;
background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.9) 0 1.5px,transparent 2px),radial-gradient(circle at 78% 8%,rgba(255,255,255,.8) 0 1.5px,transparent 2px),radial-gradient(circle at 40% 70%,rgba(255,255,255,.6) 0 1px,transparent 1.5px),radial-gradient(circle at 90% 60%,rgba(255,255,255,.7) 0 1.5px,transparent 2px),radial-gradient(circle at 25% 92%,rgba(255,255,255,.6) 0 1px,transparent 1.5px),linear-gradient(160deg,#1b1450 0%,#33208a 55%,#4b2fb0 100%);background-attachment:fixed;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;color:#fff}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo .st{font-size:38px;filter:drop-shadow(0 0 10px #ffd23f);animation:tw 2.5s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.12) rotate(8deg)}}
.logo b{display:block;font-size:24px;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,#ffd23f,#ff9fbf,#9fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:13px;opacity:.85;font-weight:800}
.top .sp{flex:1}
.pill{white-space:nowrap;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 14px;font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px}
.ibtn{background:rgba(255,255,255,.14);color:#fff;border-radius:14px;width:44px;height:44px;font-size:20px}
#app{padding:6px 16px 30px;max-width:1500px;margin:0 auto}
.hello{background:#fff;border-radius:24px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.hello h2{margin:0;font-size:24px;font-weight:900}
.hello input{font:inherit;font-weight:800;font-size:18px;padding:10px 14px;border-radius:14px;border:3px solid #e6e1ff;outline:none;min-width:180px}
.hello input:focus{border-color:var(--purple)}
.lbl{font-weight:900;font-size:14px;color:#7a74a8;text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#f1eeff;color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:900;font-size:16px}
.chip.on{background:var(--purple);color:#fff;box-shadow:0 4px 0 #5b33c9}
.modes{display:flex;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.mode{flex:1;min-width:200px;background:rgba(255,255,255,.12);color:#fff;border-radius:20px;padding:14px;text-align:left;border:3px solid transparent}
.mode b{font-size:20px;display:block;font-weight:900}.mode span{font-size:14px;opacity:.85;font-weight:700}
.mode.on{background:#fff;color:var(--ink);border-color:var(--yellow);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.sec{border-radius:24px;padding:18px 12px 16px;color:#fff;text-align:center;position:relative;box-shadow:0 7px 0 rgba(0,0,0,.22);transition:transform .15s}
.sec:hover{transform:translateY(-4px) rotate(-1deg)}.sec:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.sec .ic{font-size:52px;line-height:64px;height:64px;display:block;font-weight:900}
.sec .ic.txt{font-size:34px;background:rgba(255,255,255,.25);border-radius:18px;width:90px;margin:0 auto}
.sec b{display:block;font-size:20px;font-weight:900;margin-top:8px}
.sec small{display:block;font-size:13px;font-weight:700;opacity:.9;margin-top:2px}
.sec .best{position:absolute;top:8px;right:10px;font-size:13px;background:rgba(0,0,0,.2);border-radius:999px;padding:2px 8px}
h3.wt{color:#fff;font-size:20px;font-weight:900;margin:22px 0 10px}
.rank{background:#fff;border-radius:20px;padding:10px 14px}
.rank div{display:flex;gap:10px;align-items:center;padding:7px 4px;font-weight:800;font-size:17px;border-bottom:2px dashed #eee}
.rank div:last-child{border:none}.rank i{font-style:normal;width:30px;text-align:center;font-weight:900}
.rank .s{margin-left:auto;color:#e0a800;font-weight:900}
.foot{color:rgba(255,255,255,.7);text-align:center;font-weight:800;font-size:13px;margin-top:26px}
/* game */
.bar-top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:12px;flex-wrap:wrap}
.back{background:rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:10px 16px;font-weight:900;font-size:16px}
.ttl{font-size:22px;font-weight:900;flex:1}
.prog{display:flex;gap:6px}.prog i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25)}
.prog i.ok{background:var(--green)}.prog i.no{background:var(--pink)}.prog i.cur{background:#fff;box-shadow:0 0 0 3px var(--yellow)}
.board{background:#fff;border-radius:28px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.2);min-height:420px;display:flex;flex-direction:column}
.qbox{display:flex;flex-direction:column;flex:1;gap:18px}
.prompt{text-align:center;font-weight:900;font-size:clamp(20px,2.6vw,34px);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;min-height:110px}
.prompt .big{font-size:clamp(40px,6vw,84px);letter-spacing:1px;width:100%}
.prompt .em{font-size:clamp(60px,9vw,120px);line-height:1.1;width:100%}
.prompt .emrow{font-size:clamp(34px,5vw,64px);width:100%;line-height:1.3}
.prompt .sub{font-size:clamp(16px,1.8vw,24px);color:#7a74a8;width:100%}
.prompt .word{font-size:clamp(40px,6vw,80px);color:var(--purple);width:100%}
.swatch{display:inline-block;width:clamp(90px,12vw,150px);height:clamp(90px,12vw,150px);border-radius:28px;border:4px solid #ddd}
.digit{font-size:clamp(70px,10vw,130px);color:var(--blue)}
.spk{background:var(--yellow);border-radius:50%;width:62px;height:62px;font-size:30px;box-shadow:0 5px 0 #d1a500}
.spk:active{transform:translateY(3px);box-shadow:0 2px 0 #d1a500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
.opt{border-radius:22px;font-weight:900;font-size:clamp(20px,2.8vw,40px);padding:14px 10px;min-height:86px;color:var(--ink);box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.15}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.opt.c0{background:#ffe0ea}.opt.c1{background:#dceaff}.opt.c2{background:#d8f7e7}.opt.c3{background:#fff0cf}
.opt .em{font-size:clamp(40px,5.5vw,72px)}
.opt svg.flag{width:min(170px,80%);height:auto}
.opt.right{background:var(--green)!important;color:#fff;animation:pop .4s}
.opt.wrong{background:var(--pink)!important;color:#fff;animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
svg.flag{border-radius:6px;box-shadow:0 0 0 2px rgba(0,0,0,.12);display:block}
.prompt svg.flag{width:clamp(200px,28vw,340px);height:auto;margin:0 auto}
.flashbox{text-align:center;font-size:clamp(46px,7vw,96px);font-weight:900;padding:20px 0;letter-spacing:6px}
.tbar{height:12px;border-radius:99px;background:#eee;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--pink));transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.streak{background:var(--orange);color:#fff;border-radius:999px;padding:6px 14px;font-weight:900;animation:pop .4s}
/* duel */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{border-radius:28px;padding:16px;background:#fff;display:flex;flex-direction:column;min-height:70vh;border:6px solid}
.panel.p0{border-color:var(--pink)}.panel.p1{border-color:var(--blue)}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.phead b{font-size:clamp(20px,2.4vw,32px);font-weight:900}
.score{font-size:clamp(34px,4vw,56px);font-weight:900;color:#fff;border-radius:18px;padding:0 18px;min-width:80px;text-align:center}
.p0 .score{background:var(--pink)}.p1 .score{background:var(--blue)}
.panel .prompt{font-size:clamp(18px,2.2vw,30px);min-height:90px}
.panel .opt{min-height:70px;font-size:clamp(18px,2.4vw,34px)}
.clock{font-size:34px;font-weight:900;background:var(--yellow);color:var(--ink);border-radius:18px;padding:4px 18px}
.clock.low{background:var(--pink);color:#fff;animation:pop .5s infinite}
/* teams */
.tscore{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tchip{flex:1;min-width:140px;border-radius:20px;padding:10px 14px;color:#fff;font-weight:900;display:flex;justify-content:space-between;align-items:center;font-size:20px;opacity:.55;transition:.2s}
.tchip.on{opacity:1;box-shadow:0 0 0 4px #fff,0 8px 0 rgba(0,0,0,.25)}
.tchip span{font-size:30px}
.turn{text-align:center;font-weight:900;font-size:clamp(22px,2.6vw,34px);color:#fff;border-radius:18px;padding:8px;margin-bottom:12px}
/* setup + result */
.setup{background:#fff;border-radius:28px;padding:24px;max-width:760px;margin:0 auto;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.setup h2{margin:0 0 6px;font-size:28px;font-weight:900}
.setup .row{margin:16px 0}
.setup input{font:inherit;font-weight:800;font-size:18px;padding:10px 14px;border-radius:14px;border:3px solid #e6e1ff;width:100%;margin-top:6px}
.tinputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{background:var(--green);color:#fff;font-weight:900;font-size:24px;border-radius:20px;padding:16px 30px;box-shadow:0 7px 0 #138a52;width:100%;margin-top:10px}
.go:active{transform:translateY(4px);box-shadow:0 3px 0 #138a52}
.go.alt{background:var(--purple);box-shadow:0 7px 0 #5b33c9}
.res{text-align:center}
.res .stars{font-size:clamp(60px,9vw,110px);letter-spacing:8px}
.res .stars .off{filter:grayscale(1);opacity:.3}
.res h2{font-size:clamp(28px,4vw,48px);margin:6px 0}
.res p{font-size:22px;font-weight:800;color:#7a74a8;margin:6px 0 16px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.btns .go{width:auto;min-width:220px}
.podium{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:10px auto 20px}
.podium div{display:flex;justify-content:space-between;color:#fff;font-weight:900;font-size:24px;border-radius:18px;padding:12px 18px}
.overlay{position:fixed;inset:0;background:rgba(27,20,80,.85);display:flex;align-items:center;justify-content:center;z-index:50;color:#fff;font-size:min(40vw,260px);font-weight:900}
.overlay.cd span{animation:pop .9s}
/* memory cards */
.mgrid{display:grid;gap:12px;margin:0 auto;width:100%;max-width:900px}
.mc{aspect-ratio:1;perspective:600px;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.f .in,.mc.m .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:18px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mc .fa{background:linear-gradient(135deg,var(--purple),var(--blue));color:#ffd23f;font-size:clamp(28px,4vw,48px);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.mc .ba{background:#fff7d6;transform:rotateY(180deg);font-size:clamp(34px,6vw,70px);box-shadow:0 5px 0 rgba(0,0,0,.12)}
.mc.m .ba{background:#d8f7e7}
.minfo{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.minfo .pill{background:#f1eeff;color:var(--ink)}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px;margin:0 auto}
.choose button{border-radius:24px;padding:26px 14px;color:#fff;font-weight:900;font-size:22px;box-shadow:0 7px 0 rgba(0,0,0,.2)}
.choose button span{display:block;font-size:56px}
.choose button small{display:block;font-size:14px;opacity:.9;margin-top:4px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (max-width:700px){
 .top{padding:8px 10px}.logo b{font-size:19px}.logo small{font-size:11px}.logo .st{font-size:30px}
 #app{padding:4px 10px 24px}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .sec .ic{font-size:42px;height:54px;line-height:54px}.sec b{font-size:17px}
 .board{padding:14px;min-height:0}.opts{gap:10px}.opt{min-height:74px}
 .duel{grid-template-columns:1fr}.panel{min-height:0}
 .tinputs,.choose{grid-template-columns:1fr}
 .ibtn{width:38px;height:38px;font-size:17px}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo" id="home-link"><span class="st">⭐</span><div><b>Little Star</b><small>Navoiy-Qorako‘l o‘quv markazi</small></div></div>
  <div class="sp"></div>
  <div class="pill" id="mystars">⭐ 0</div>
  <button class="ibtn" id="inst" title="Ilovani o‘rnatish" style="display:none;width:auto;padding:0 12px;font-size:15px;font-weight:900">📲 O‘rnatish</button>
  <button class="ibtn" id="snd" title="Ovoz">🔊</button>
  <button class="ibtn" id="fs" title="To‘liq ekran">⛶</button>
</header>
<main id="app"></main>
<canvas id="cf"></canvas>
<script>
"use strict";
/* ============ CORE: helpers, data, question generators ============ */
const R=n=>Math.floor(Math.random()*n);
const pick=a=>a[R(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
function mkOpts(correct,wrongs,render){
  render=render||(x=>String(x));
  const set=[correct];
  for(const w of wrongs){if(set.length>=4)break;if(!set.some(s=>String(s)===String(w)))set.push(w)}
  return shuffle(set).map(v=>({html:render(v),ok:String(v)===String(correct)}));
}
function numWrongs(a){
  const c=shuffle([1,-1,2,-2,10,-10,3,-3,5,-5]).map(d=>a+d);
  if(a>=10&&a<100){const s=String(a);const sw=+(s[1]+s[0]);if(sw!==a)c.unshift(sw)}
  return c.filter(x=>x>=0&&x!==a);
}
const big=t=>`<div class="big">${t}</div>`;
const txt=t=>`<div>${t}</div>`;
const EM=['🍎','🍌','🍇','🍐','🍊','🍉','🍓','🐱','🐶','🐴','🦁','🐘','🐰','🐻','🐟','🐔','🚗','🚌','✈️','🚲','⚽','⭐','🌸','🌳','☀️','🌙','🏠','📖','✏️','⏰','🔑','🎈','🎁','🍦','🐢','🦋'];
const FRUITS=['🍎','🍌','🍇','🍐','🍊','🍉','🍓','🍋'];

/* ---------- MATEMATIKA ---------- */
function genMath(L){
  const t=L===1?pick(['add','sub','count','miss','add']):L===2?pick(['add2','sub2','mul','miss2','add2','sub2']):pick(['mul','div','add3','sub3','word','missmul','mul']);
  let q,a,x,y;
  switch(t){
    case 'add':x=1+R(10);y=1+R(10);q=`${x} + ${y} = ?`;a=x+y;break;
    case 'sub':x=5+R(16);y=R(x+1);q=`${x} − ${y} = ?`;a=x-y;break;
    case 'count':{a=2+R(9);const e=pick(FRUITS);
      return{key:'c'+a+e,prompt:`<div class="emrow">${Array(a).fill(e).join(' ')}</div><div class="sub">Nechta ${e} bor? Sanab ko‘r!</div>`,opts:mkOpts(a,numWrongs(a).filter(v=>v>0))};}
    case 'miss':x=1+R(10);y=1+R(10);q=`${x} + ? = ${x+y}`;a=y;break;
    case 'add2':x=10+R(70);y=1+R(Math.max(1,99-x));q=`${x} + ${y} = ?`;a=x+y;break;
    case 'sub2':x=20+R(80);y=1+R(x-1);q=`${x} − ${y} = ?`;a=x-y;break;
    case 'mul':if(L===2){x=2+R(4);y=1+R(10)}else{x=2+R(9);y=2+R(9)}q=`${x} × ${y} = ?`;a=x*y;break;
    case 'miss2':x=10+R(50);y=5+R(40);if(R(2)){q=`${x} + ? = ${x+y}`;a=y}else{q=`? − ${y} = ${x}`;a=x+y}break;
    case 'div':y=2+R(8);a=2+R(9);x=y*a;q=`${x} : ${y} = ?`;break;
    case 'add3':x=100+R(500);y=20+R(350);q=`${x} + ${y} = ?`;a=x+y;break;
    case 'sub3':x=200+R(700);y=20+R(x-100);q=`${x} − ${y} = ?`;a=x-y;break;
    case 'missmul':x=2+R(9);y=2+R(9);q=`? × ${y} = ${x*y}`;a=x;break;
    case 'word':{
      if(R(2)){x=2+R(8);y=2+R(8);a=x*y;
        return{key:'w1'+x+y,prompt:txt(`📦 Har bir qutida ${x} ta qalam bor.<br>${y} ta qutida nechta qalam bor?`),opts:mkOpts(a,numWrongs(a))};}
      y=2+R(5);a=2+R(8);x=y*a;
      return{key:'w2'+x+y,prompt:txt(`🍬 ${x} ta konfetni ${y} ta bolaga teng bo‘lishdi.<br>Har biriga nechta tegadi?`),opts:mkOpts(a,numWrongs(a).filter(v=>v>0))};}
  }
  return{key:q,prompt:big(q),opts:mkOpts(a,numWrongs(a))};
}

/* ---------- MANTIQ ---------- */
const GROUPS=[['🍎','🍌','🍇','🍐','🍊','🍉','🍓'],['🐱','🐶','🐴','🐄','🦁','🐘','🐰','🐻'],['🚗','🚌','✈️','🚲','🚂','🚢'],['👕','👖','👗','🧦','🧢'],['⚽','🏀','🎾','🏐'],['🌸','🌻','🌷','🌹']];
const RIDDLES=[
 {l:1,q:'Bir haftada necha kun bor?',a:'7',w:['5','6','10']},
 {l:1,q:'Bugun dushanba. Ertaga qaysi kun?',a:'Seshanba',w:['Yakshanba','Juma','Chorshanba']},
 {l:1,q:'Uchburchakning nechta burchagi bor? 🔺',a:'3',w:['4','2','5']},
 {l:1,q:'Kvadratning nechta tomoni bor? 🟦',a:'4',w:['3','5','6']},
 {l:1,q:'Anvar 7 yoshda. Singlisi undan 2 yosh kichik. Singlisi necha yoshda?',a:'5',w:['9','4','6']},
 {l:2,q:'Bugun juma. Kecha qaysi kun edi?',a:'Payshanba',w:['Shanba','Chorshanba','Yakshanba']},
 {l:2,q:'Bir yilda nechta oy bor?',a:'12',w:['10','7','4']},
 {l:2,q:'1 kg paxta og‘irmi yoki 1 kg temir?',a:'Teng',w:['Temir','Paxta']},
 {l:2,q:'Ali Validan baland. Vali Soliddan baland. Eng past kim?',a:'Soli',w:['Ali','Vali']},
 {l:2,q:'2 ta mushukning jami nechta oyog‘i bor? 🐱🐱',a:'8',w:['4','6','10']},
 {l:2,q:'Qaysi oyda 28 yoki 29 kun bo‘ladi?',a:'Fevral',w:['Yanvar','Mart','Dekabr']},
 {l:3,q:'Qatorda 5 bola turibdi. Lola chapdan 2-o‘rinda. U o‘ngdan nechanchi?',a:'4',w:['3','2','5']},

function genLogic(L){
  const t=pick(L===1?['seq','pat','odd','pat','rid']:['seq','pat','odd','rid','seq']);
  if(t==='seq'){
    let s=[],a;
    if(L===1){const st=1+R(10),d=pick([1,2]);for(let i=0;i<4;i++)s.push(st+i*d);a=st+4*d}
    else if(L===2){const d=pick([2,3,5,10]),down=R(2);const st=down?40+R(50):1+R(20);const dd=down?-d:d;for(let i=0;i<4;i++)s.push(st+i*dd);a=st+4*dd}
    else{const k=R(3);
      if(k===0){const st=1+R(4);for(let i=0;i<5;i++)s.push(st*2**i);a=st*32}
      else if(k===1){let v=1+R(5);for(let i=1;i<=5;i++){s.push(v);v+=i}a=v}
      else{const u=2+R(3),d=1;let v=1+R(5);for(let i=0;i<6;i++){s.push(v);v+=(i%2===0?u:-d)}a=v}}
    return{key:'s'+s.join(','),prompt:`<div class="sub">Keyingi son qaysi?</div>${big(s.join(', ')+', ?')}`,opts:mkOpts(a,numWrongs(a))};
  }
  if(t==='pat'){
    const tp=pick(L===1?['AB','ABC']:L===2?['AAB','ABC','ABB']:['ABBC','AABB','ABCB','AABC']);
    const u=sample(EM,4);const map={A:u[0],B:u[1],C:u[2]};
    const seq=[];let i=0;while(seq.length<8){seq.push(map[tp[i%tp.length]]);i++}
    const a=seq[7];const shown=seq.slice(0,7);
    const uniq=[...new Set(Object.values(map).filter((v,k)=>tp.includes('ABC'[k])))];
    return{key:'p'+shown.join(''),prompt:`<div class="sub">Navbatdagisi qaysi?</div><div class="emrow">${shown.join(' ')} ❓</div>`,opts:mkOpts(a,shuffle([...uniq,u[3]]),v=>`<span class="em">${v}</span>`)};
  }
  if(t==='odd'){
    const [g1,g2]=sample(GROUPS,2);const three=sample(g1,3),one=pick(g2);
    return{key:'o'+three.join('')+one,prompt:`<div>Qaysi biri ortiqcha? 🤔</div><div class="sub">Uchtasi bir guruhdan, bittasi boshqa</div>`,opts:shuffle([...three.map(e=>({html:`<span class="em">${e}</span>`,ok:false})),{html:`<span class="em">${one}</span>`,ok:true}])};
  }
  const r=pick(RIDDLES.filter(x=>x.l<=L));
  return{key:r.q,prompt:txt('🧩 '+r.q),opts:mkOpts(r.a,shuffle(r.w))};
}

function genMemory(L){
  const t=pick(L===1?['seen','seen','notseen']:L===2?['seen','notseen','digits']:['notseen','first','digits','last']);
  if(t==='digits'){
    const n=L===2?3:4;const d=Array.from({length:n},()=>R(9)+1);const a=d.join(' ');
    const wr=[];for(let k=0;k<8;k++){const c=d.slice();const i=R(n);c[i]=(c[i]%9)+1;if(R(2)){const j=(i+1)%n;[c[i],c[j]]=[c[j],c[i]]}wr.push(c.join(' '))}
    return{key:'d'+a,flash:{html:a,ms:1800+n*600},prompt:txt('Qaysi sonlar edi? 🔢'),opts:mkOpts(a,wr)};
  }
  const n=L===1?3:L===2?4:5;const all=sample(EM,n+3);const shown=all.slice(0,n),other=all.slice(n);
  const ms=1800+n*650;const fl={html:shown.join(' '),ms};
  const r=v=>`<span class="em">${v}</span>`;
  if(t==='seen')return{key:'m'+shown.join(''),flash:fl,prompt:txt('Qaysi biri ko‘rsatilgan edi? 👀'),opts:mkOpts(pick(shown),other,r)};
  if(t==='notseen'){const ans=other[0];return{key:'n'+shown.join(''),flash:fl,prompt:txt('Qaysi biri <u>yo‘q</u> edi? 🙈'),opts:mkOpts(ans,sample(shown,3),r)};}
  const a=t==='first'?shown[0]:shown[n-1];
  return{key:t+shown.join(''),flash:fl,prompt:txt(t==='first'?'Birinchi rasm qaysi edi? 1️⃣':'Oxirgi rasm qaysi edi? 🔚'),opts:mkOpts(a,shuffle(shown.filter(x=>x!==a)),r)};
}

  return()=>{let q;for(let i=0;i<40;i++){const sid=id==='mix'?pick(MIXABLE):id;q=SEC[sid].gen(L,ctx);q.sec=sid;if(!seen.has(q.key))break}seen.add(q.key);return q};

<script>
"use strict";
if(typeof document!=='undefined'){
/* ============ UI ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={name:store.get('ls_name',''),level:store.get('ls_level',1),mode:'solo'};
let timers=[];
const T=(f,ms)=>{const id=setTimeout(f,ms);timers.push(id);return id};
const IV=(f,ms)=>{const id=setInterval(f,ms);timers.push(id);return id};
function stopAll(){timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers=[];try{speechSynthesis.cancel()}catch(e){}const o=document.querySelector('.overlay');if(o)o.remove()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LEVELS=[[1,'6–7 yosh'],[2,'8 yosh'],[3,'9–10 yosh']];

/* sound */
let AC=null,soundOn=store.get('ls_sound',true);
function tone(f,d,type,v,delay){if(!soundOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sGood=()=>{tone(660,.12);tone(990,.2,'sine',.15,.1)};
const sBad=()=>tone(170,.3,'square',.07);
const sWin=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.28,'triangle',.15,i*.12));
const sTick=()=>tone(880,.06,'sine',.08);
function say(text,lang){if(!soundOn)return;try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.85;const v=s.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.slice(0,2)));if(v)u.voice=v;s.speak(u)}catch(e){}}
try{speechSynthesis.getVoices()}catch(e){}

/* confetti */
const cv=$('#cf'),cx=cv.getContext('2d');let parts=[],raf=null;
function confetti(n){cv.width=innerWidth;cv.height=innerHeight;const cols=['#ff5c8a','#3d8bff','#1fbf75','#ff9f1c','#8e5cff','#ffd23f'];
 for(let i=0;i<(n||160);i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.6,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*8,c:cols[R(6)],r:Math.random()*6,vr:(Math.random()-.5)*.3,star:Math.random()<.3});
 if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;if(p.star){cx.font=p.s*2+'px serif';cx.fillText('⭐',0,0)}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});parts=parts.filter(p=>p.y<cv.height+40);raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),null)}

/* stars */
function players(){return store.get('ls_players',{})}
function myStars(){return S.name?(players()[S.name]||0):0}
function addStars(n){if(!S.name||!n)return;const p=players();p[S.name]=(p[S.name]||0)+n;store.set('ls_players',p);updStars()}
function bestKey(id){return 'ls_best_'+(S.name||'_')+'_'+id+'_'+S.level}

sndBtn.onclick=()=>{soundOn=!soundOn;store.set('ls_sound',soundOn);updSnd();if(soundOn)sGood()};
$('#fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};

/* ===== question renderer ===== */
function renderQ(box,q,o){
  o=o||{};const audio=o.audio!==false;const evt=o.evt||'click';
  let done=false,wrap=null;
  const ctl={reveal(){if(done||!wrap){done=true;return}done=true;[...wrap.children].forEach((c,k)=>{c.disabled=true;if(q.opts[k].ok)c.classList.add('right')})}};
  const show=()=>{
    box.innerHTML=`<div class="prompt">${q.prompt}${q.speak&&audio?'<button class="spk" title="Tinglash">🔊</button>':''}</div><div class="opts"></div>`;
    if(q.speak&&audio){box.querySelector('.spk').addEventListener('click',e=>{e.stopPropagation();say(q.speak.t,q.speak.lang)});if(q.auto)T(()=>say(q.speak.t,q.speak.lang),250)}
    wrap=box.querySelector('.opts');
    q.opts.forEach((op,i)=>{const b=document.createElement('button');b.className='opt c'+i;b.innerHTML=op.html;
      b.addEventListener(evt,e=>{e.preventDefault();if(done)return;done=true;
        [...wrap.children].forEach(c=>c.disabled=true);
        if(op.ok){b.classList.add('right');sGood()}else{b.classList.add('wrong');sBad();[...wrap.children].forEach((c,k)=>{if(q.opts[k].ok)c.classList.add('right')})}
        if(q.after&&audio)say(q.after.t,q.after.lang);
        o.onAnswer&&o.onAnswer(op.ok);
      });wrap.appendChild(b)});
    o.onShown&&o.onShown();
  };
  if(q.flash){box.innerHTML=`<div class="prompt"><div>Eslab qol! 👀</div></div><div class="flashbox">${q.flash.html}</div><div class="tbar"><i style="animation-duration:${q.flash.ms}ms"></i></div>`;T(show,q.flash.ms)}
  else show();
  return ctl;
}
function countdown(cb){const ov=document.createElement('div');ov.className='overlay cd';document.body.appendChild(ov);let n=3;
  const step=()=>{if(n===0){ov.innerHTML='<span style="font-size:.5em">Boshlandi!</span>';tone(1047,.3,'triangle',.18);T(()=>{ov.remove();cb()},600);return}ov.innerHTML=`<span>${n}</span>`;tone(660,.15,'triangle',.15);n--;T(step,800)};step()}
function topBar(title,extra){return`<div class="bar-top"><button class="back" id="bk">← Chiqish</button><div class="ttl">${title}</div>${extra||''}</div>`}
function bindBack(){$('#bk').onclick=()=>home()}

/* ===== HOME ===== */
function home(){
  stopAll();updStars();
  const modes=[['solo','🎮 O‘ynash','Bitta o‘quvchi, 10 ta savol'],['duel','⚔️ Duel — doskada','2 o‘quvchi bir vaqtda bellashadi'],['teams','🏆 Jamoalar','2–4 jamoa navbat bilan']];
  const p=players();const top=Object.entries(p).sort((a,b)=>b[1]-a[1]).slice(0,10);
  app.innerHTML=`
  <div class="hello">
    <div style="flex:1;min-width:220px"><h2>Salom${S.name?', '+esc(S.name):''}! 👋</h2><div class="lbl" style="margin-top:4px">Ismingni yoz — yulduzlar to‘planadi</div></div>
    <input id="nm" maxlength="20" placeholder="Ismingiz..." value="${esc(S.name)}">
    <div><div class="lbl" style="margin-bottom:6px">Yosh / daraja</div><div class="chips" id="lv">${LEVELS.map(([v,t])=>`<button class="chip ${S.level===v?'on':''}" data-v="${v}">${t}</button>`).join('')}</div></div>
  </div>
  <div class="modes">${modes.map(([v,b,s])=>`<button class="mode ${S.mode===v?'on':''}" data-m="${v}"><b>${b}</b><span>${s}</span></button>`).join('')}</div>
  <div class="grid">${SECTIONS.map(s=>{const b=store.get(bestKey(s.id),null);return`<button class="sec" data-s="${s.id}" style="background:${s.bg}">${b!=null&&S.mode==='solo'?`<span class="best">🏅 ${b}/10</span>`:''}<span class="ic ${s.txt?'txt':''}">${s.ic}</span><b>${s.name}</b><small>${s.sub}</small></button>`}).join('')}</div>
  ${top.length?`<h3 class="wt">🏆 Yulduzlar reytingi</h3><div class="rank">${top.map(([n,v],i)=>`<div><i>${['🥇','🥈','🥉'][i]||i+1}</i>${esc(n)}<span class="s">⭐ ${v}</span></div>`).join('')}</div>`:''}

  app.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{const id=b.dataset.s;
    if(S.mode==='solo'){if(id==='memory')memChoose();else solo(id)}

/* ===== SOLO ===== */
function solo(id){
  stopAll();const sec=SEC[id];const src=makeSource(id,S.level);const N=10;let i=0,ok=0,streak=0;const res=[];
  app.innerHTML=topBar(`${sec.txt?'':sec.ic} ${sec.name}`,`<div class="prog" id="pg"></div>`)+`<div class="board"><div style="display:flex;justify-content:space-between;align-items:center;min-height:34px"><span class="lbl" id="qn"></span><span id="stk"></span></div><div class="qbox" id="qb"></div></div>`;bindBack();
  const pg=$('#pg'),qb=$('#qb');
  const draw=()=>{pg.innerHTML=Array.from({length:N},(_,k)=>`<i class="${k<res.length?(res[k]?'ok':'no'):k===i?'cur':''}"></i>`).join('');$('#qn').textContent=`${i+1}-savol / ${N}`};
  const next=()=>{if(i>=N)return finish();draw();renderQ(qb,src(),{onAnswer:r=>{res.push(r);if(r){ok++;streak++}else streak=0;
      $('#stk').innerHTML=streak>=3?`<span class="streak">🔥 ${streak} ta ketma-ket!</span>`:'';draw();i++;T(next,r?900:1700)}})};
  const finish=()=>{const st=ok>=9?3:ok>=7?2:ok>=5?1:0;const bk=bestKey(id);if(ok>(store.get(bk,-1)))store.set(bk,ok);addStars(ok);
    result({stars:st,title:st===3?'Ajoyib! Sen haqiqiy yulduzsan!':st===2?'Barakalla!':st===1?'Yaxshi!':'Yana urinib ko‘r!',text:`${N} tadan ${ok} ta to‘g‘ri · +${ok} ⭐`,again:()=>solo(id)})};
  next();
}

  app.innerHTML=`<div class="setup res"><div class="stars">${[0,1,2].map(k=>`<span class="${k<r.stars?'':'off'}">⭐</span>`).join('')}</div><h2>${r.title}</h2><p>${r.text}</p><div class="btns"><button class="go" id="ag">🔁 Yana o‘ynash</button><button class="go alt" id="hm">🏠 Bosh sahifa</button></div></div>`;
  $('#ag').onclick=r.again;$('#hm').onclick=home}

function memChoose(){stopAll();
  app.innerHTML=topBar('🧠 Xotira')+`<div class="choose"><button id="mc1" style="background:linear-gradient(135deg,#00b894,#3fd6a8)"><span>🃏</span>Juftini top<small>Kartalarni ochib, bir xillarini top</small></button><button id="mc2" style="background:linear-gradient(135deg,#8e5cff,#b07bff)"><span>👀</span>Eslab qol<small>Rasmlarni eslab qol va savolga javob ber</small></button></div>`;
  bindBack();$('#mc1').onclick=memCards;$('#mc2').onclick=()=>solo('memory')}
function memCards(){stopAll();
  const pairs=S.level===1?6:S.level===2?8:10;const cols=S.level===1?4:S.level===2?4:5;
  const cards=shuffle(sample(EM,pairs).flatMap(e=>[e,e]));

  app.innerHTML=topBar('🃏 Juftini top')+`<div class="board"><div class="minfo"><span class="pill">👆 Urinish: <b id="mv">0</b></span><span class="pill">⏱️ <b id="tm">0</b> s</span><span class="pill">✅ <b id="fd">0</b>/${pairs}</span></div><div class="mgrid" id="mg" style="grid-template-columns:repeat(${cols},1fr);max-width:${cols*150}px"></div></div>`;bindBack();

    b.onclick=()=>{if(lock||b.classList.contains('f')||b.classList.contains('m'))return;b.classList.add('f');tone(520,.06);open.push(b);
      if(open.length===2){moves++;$('#mv').textContent=moves;const[a,c]=open;
        if(a.innerHTML===c.innerHTML){T(()=>{a.classList.add('m');c.classList.add('m');sGood();found++;$('#fd').textContent=found;open=[];
          if(found===pairs){const st=moves<=pairs*1.5?3:moves<=pairs*2.2?2:1;addStars(st*2);T(()=>result({stars:st,title:st===3?'Zo‘r xotira!':st===2?'Barakalla!':'Yaxshi!',text:`${moves} ta urinish · ${sec} soniya · +${st*2} ⭐`,again:memCards}),700)}},300)}
        else{lock=true;T(()=>{a.classList.remove('f');c.classList.remove('f');open=[];lock=false},900)}}};
    mg.appendChild(b)});
}
/* ===== DUEL ===== */

function duelSetup(id){stopAll();const sec=SEC[id];

   <div class="row tinputs"><label class="lbl" style="color:var(--pink)">Chap tomon<input id="p0" value="${esc(duelCfg.p[0])}" maxlength="16"></label><label class="lbl" style="color:var(--blue)">O‘ng tomon<input id="p1" value="${esc(duelCfg.p[1])}" maxlength="16"></label></div>
   <div class="row"><div class="lbl" style="margin-bottom:6px">Vaqt</div><div class="chips" id="tt">${[45,60,90,120].map(v=>`<button class="chip ${duelCfg.t===v?'on':''}" data-v="${v}">${v} soniya</button>`).join('')}</div></div>
   <div class="row"><div class="lbl" style="margin-bottom:6px">Daraja: ${LEVELS.find(l=>l[0]===S.level)[1]}</div></div>
   <button class="go" id="st">▶️ Boshlash</button></div>`;bindBack();

function duel(id){stopAll();const sec=SEC[id];let left=duelCfg.t,ended=false;const sc=[0,0];

  countdown(()=>{
    [0,1].forEach(k=>{const src=makeSource(id,S.level,{noAudio:true});const box=$('#qb'+k);
      const next=()=>{if(ended)return;renderQ(box,src(),{audio:false,evt:'pointerdown',onAnswer:ok=>{if(ended)return;if(ok){sc[k]++;$('#sc'+k).textContent=sc[k]}T(next,ok?450:1300)}})};next()});
    IV(()=>{left--;const ck=$('#ck');ck.textContent=left;if(left<=10){ck.classList.add('low');sTick()}
      if(left<=0){ended=true;stopAll();const w=sc[0]===sc[1]?-1:sc[0]>sc[1]?0:1;
        result({stars:3,title:w<0?'Durang! 🤝':`🏆 G‘olib: ${esc(duelCfg.p[w])}!`,text:`${esc(duelCfg.p[0])}: ${sc[0]}  —  ${esc(duelCfg.p[1])}: ${sc[1]}`,again:()=>duel(id)})}},1000);
  });
}

/* ===== TEAMS ===== */
const TCOL=['#ff5c8a','#3d8bff','#1fbf75','#ff9f1c'];
let teamCfg={n:2,names:['Qizil yulduzlar','Ko‘k yulduzlar','Yashil yulduzlar','Sariq yulduzlar'],per:5,sec:20};
function teamSetup(id){stopAll();const sec=SEC[id];
  const draw=()=>{app.innerHTML=topBar('🏆 Jamoalar — '+sec.name)+`<div class="setup"><h2>🏆 Jamoaviy musobaqa</h2><div class="lbl">Jamoalar navbat bilan doskaga chiqib javob beradi.</div>
   <div class="row"><div class="lbl" style="margin-bottom:6px">Jamoalar soni</div><div class="chips" id="tn">${[2,3,4].map(v=>`<button class="chip ${teamCfg.n===v?'on':''}" data-v="${v}">${v} ta</button>`).join('')}</div></div>
   <div class="row tinputs">${Array.from({length:teamCfg.n},(_,k)=>`<label class="lbl" style="color:${TCOL[k]}">${k+1}-jamoa<input class="tnm" data-k="${k}" value="${esc(teamCfg.names[k])}" maxlength="18"></label>`).join('')}</div>
   <div class="row"><div class="lbl" style="margin-bottom:6px">Har jamoaga savollar</div><div class="chips" id="tp">${[3,5,7,10].map(v=>`<button class="chip ${teamCfg.per===v?'on':''}" data-v="${v}">${v} ta</button>`).join('')}</div></div>
   <div class="row"><div class="lbl" style="margin-bottom:6px">Har savolga vaqt</div><div class="chips" id="ts">${[15,20,30].map(v=>`<button class="chip ${teamCfg.sec===v?'on':''}" data-v="${v}">${v} soniya</button>`).join('')}</div></div>
   <button class="go" id="st">▶️ Boshlash</button></div>`;bindBack();
   const save=()=>app.querySelectorAll('.tnm').forEach(i=>teamCfg.names[+i.dataset.k]=i.value.trim()||teamCfg.names[+i.dataset.k]);
   app.querySelectorAll('#tn .chip').forEach(b=>b.onclick=()=>{save();teamCfg.n=+b.dataset.v;draw()});
   app.querySelectorAll('#tp .chip').forEach(b=>b.onclick=()=>{save();teamCfg.per=+b.dataset.v;draw()});
   app.querySelectorAll('#ts .chip').forEach(b=>b.onclick=()=>{save();teamCfg.sec=+b.dataset.v;draw()});
   $('#st').onclick=()=>{save();teams(id)}};
  draw();
}
function teams(id){stopAll();const sec=SEC[id];const n=teamCfg.n;const tm=Array.from({length:n},(_,k)=>({name:teamCfg.names[k],c:TCOL[k],s:0}));
  const src=makeSource(id,S.level);let turn=0;const total=n*teamCfg.per;
  app.innerHTML=topBar('🏆 '+sec.name,`<span class="pill" id="qc"></span>`)+`<div class="tscore" id="tsc"></div><div class="turn" id="tu"></div><div class="board"><div class="tbar" id="tb" style="margin-bottom:12px"></div><div class="qbox" id="qb"></div></div>`;bindBack();
  const drawS=()=>{$('#tsc').innerHTML=tm.map((t,k)=>`<div class="tchip ${k===turn%n?'on':''}" style="background:${t.c}">${esc(t.name)}<span>${t.s}</span></div>`).join('')};
  const next=()=>{if(turn>=total)return fin();const t=tm[turn%n];drawS();$('#qc').textContent=`${turn+1} / ${total}`;
    const tu=$('#tu');tu.style.background=t.c;tu.textContent=`Navbat: ${t.name} 👉`;$('#tb').innerHTML='';let tid=null,ans=false;
    const ctl=renderQ($('#qb'),src(),{onShown:()=>{$('#tb').innerHTML=`<i style="animation-duration:${teamCfg.sec}s"></i>`;tid=T(()=>{if(ans)return;ans=true;ctl.reveal();sBad();tu.textContent='⏰ Vaqt tugadi!';T(()=>{turn++;next()},1800)},teamCfg.sec*1000)},
      onAnswer:ok=>{if(ans)return;ans=true;clearTimeout(tid);$('#tb').innerHTML='';if(ok){t.s++;drawS();tu.textContent=`✅ To‘g‘ri! +1 — ${t.name}`}else tu.textContent='❌ Afsus...';T(()=>{turn++;next()},ok?1300:2000)}})};
  const fin=()=>{stopAll();sWin();confetti(220);const srt=tm.slice().sort((a,b)=>b.s-a.s);const tie=srt.length>1&&srt[0].s===srt[1].s;
    app.innerHTML=`<div class="setup res"><div class="stars">🏆</div><h2>${tie?'Durang! 🤝':'G‘olib: '+esc(srt[0].name)+'!'}</h2><div class="podium">${srt.map((t,k)=>`<div style="background:${t.c}"><span>${['🥇','🥈','🥉','4️⃣'][k]} ${esc(t.name)}</span><span>${t.s} ball</span></div>`).join('')}</div><div class="btns"><button class="go" id="ag">🔁 Yana o‘ynash</button><button class="go alt" id="hm">🏠 Bosh sahifa</button></div></div>`;
    $('#ag').onclick=()=>teams(id);$('#hm').onclick=home};
  countdown(next);
}

/* PWA: ilova sifatida o'rnatish va oflayn ishlash */
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('inst');if(b)b.style.display=''});
document.getElementById('inst').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;document.getElementById('inst').style.display='none'};
home();
}
